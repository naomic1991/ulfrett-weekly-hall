/* Connected weekly schedule controls — designed to stay beneath the approved hall artwork */

.weeknav{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.smallbtn,.actionbtn{background:#30271f;border:1px solid #9f7948;color:#f4d69d;padding:9px 13px;border-radius:9px;font:inherit;cursor:pointer}
.smallbtn:hover,.actionbtn:hover{background:#4a3627}.actionbtn{background:#584022}.muted{color:#b7a78b}.status{min-height:20px;margin:12px auto;text-align:center;color:#e5bd79}
.editor-toggle{margin:5px auto;display:block;font-size:12px;background:none;border:0;color:#b9a78e;text-decoration:underline;cursor:pointer}
.editor{margin:14px auto 0;max-width:600px;padding:18px;border:1px solid #80623f;background:#201a19;border-radius:12px}
.editor h3{font:24px Georgia,serif;color:#f5d99e;margin:0 0 10px}
.editor label{display:block;margin:9px 0 3px}.editor input,.editor textarea,.editor select{width:100%;padding:10px 11px;background:#0f151b;color:#f6e7c8;border:1px solid #857153;border-radius:7px;font:inherit}.editor textarea{min-height:75px;resize:vertical}
.editor .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.editor .buttons .danger{border-color:#a55d55;color:#f5c0b7}
.hidden{display:none!important}.editor .hint{font-size:12px;color:#c3b79f;margin:8px 0}.status.error{color:#ffb4a9}
.event{overflow:auto;max-height:32%;min-height:17.8%}.event .entry{margin-bottom:1.2cqw}.event .entry+.entry{padding-top:1.2cqw;border-top:1px solid #805d3b}.event p{max-width:95%;overflow-wrap:anywhere}.event .timehost{margin:0.6cqw auto}.event .empty{font-size:2.4cqw;color:#d9c0a3}

for(let i=0;i<7;i++){const b=document.createElement('button');b.className='day';b.setAttribute('aria-label',dayNames[i]);b.addEventListener('click',()=>show(i));days.appendChild(b)}
function show(i){
 selected=i;[...days.children].forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(i===j));});
 const dayEvents=eventsFor(i),date=dateFor(i);
 let html='<div class="weekday">'+esc(dayNames[i])+' · '+friendlyDate(date)+'</div>';
 if(!dayEvents.length)html+='<h2>No event announced</h2><p class="empty">There is nothing scheduled for this day yet. Check back soon.</p>';
 else html+=dayEvents.map(e=>'<div class="entry"><h2>'+esc(e.title)+'</h2><div class="meta timehost">'+(e.host?'<span>Host: '+esc(e.host)+'</span>':'')+(e.start_time?'<span>Time: '+esc(e.start_time.slice(0,5))+' UK</span>':'')+'</div>'+(e.description?'<p>'+esc(e.description)+'</p>':'')+'</div>').join('');
 eventPanel.innerHTML=html;
 if(editorAuthorized)populatePicker();
}
async function loadWeek(){
 $('weekLabel').textContent=friendlyDate(weekMonday)+' – '+friendlyDate(addDays(weekMonday,6));
 setStatus('Loading schedule…');
 try{entries=await api('/rest/v1/weekly_events?select=id,event_date,title,host,start_time,description&event_date=gte.'+weekMonday+'&event_date=lte.'+dateFor(6)+'&order=event_date.asc,start_time.asc');setStatus('Week of '+friendlyDate(weekMonday)+' · '+entries.length+' scheduled '+(entries.length===1?'activity':'activities'));}
 catch(err){entries=[];setStatus('Could not load the schedule: '+err.message,true)}
 show(selected);
}
$('prevWeek').addEventListener('click',()=>{weekMonday=addDays(weekMonday,-7);loadWeek()});
$('nextWeek').addEventListener('click',()=>{weekMonday=addDays(weekMonday,7);loadWeek()});
$('editorToggle').addEventListener('click',()=>{$('editorArea').classList.toggle('hidden');$('editorToggle').textContent=$('editorArea').classList.contains('hidden')?'Spiritual Team · Editor login':'Close editor'});
async function checkEditor(){
 if(!session){editorAuthorized=false;updateAuthUI();return}
 try{await api('/rest/v1/hall_editors?select=user_id&user_id=eq.'+encodeURIComponent(session.user.id)).then(rows=>{editorAuthorized=rows.length>0});if(!editorAuthorized)editStatus('This account does not have editor permission.',true);}
 catch(err){editorAuthorized=false;editStatus('Could not verify editor access: '+err.message,true)}
 updateAuthUI();
}
function updateAuthUI(){ $('loginArea').classList.toggle('hidden',editorAuthorized);$('manageArea').classList.toggle('hidden',!editorAuthorized);if(editorAuthorized){$('who').textContent=session.user.email||'editor';$('editorToggle').textContent='Spiritual Team · Manage schedule';populatePicker()}}
async function signIn(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password){editStatus('Enter your email and password.',true);return}
 $('loginBtn').disabled=true;editStatus('Signing in…');
 try{const res=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});session=res;sessionStorage.setItem('hallSession',JSON.stringify(res));$('password').value='';editStatus('Signed in. Checking editor permission…');await checkEditor();if(editorAuthorized)editStatus('Ready to edit. Select a day above.');}
 catch(err){editStatus('Sign-in failed: '+err.message,true)}finally{$('loginBtn').disabled=false}
}
$('loginBtn').addEventListener('click',signIn);
async function refreshSession(){if(!session?.refresh_token)return false;try{const res=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session=res;sessionStorage.setItem('hallSession',JSON.stringify(res));return true}catch{session=null;sessionStorage.removeItem('hallSession');return false}}
async function authorizedCall(path,options){if(session&&session.expires_at&&session.expires_at*1000<Date.now()+60000)await refreshSession();if(!session)throw new Error('Session expired. Please sign in again.');return api(path,options)}
function populatePicker(){const current=$('eventPicker').value;const events=eventsFor(selected);$('eventPicker').innerHTML='<option value="">+ New activity</option>'+events.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.title)+'</option>').join('');if(events.some(e=>e.id===current))$('eventPicker').value=current;else $('eventPicker').value='';fillEditor()}
function fillEditor(){const event=entries.find(e=>e.id===$('eventPicker').value);$('title').value=event?.title||'';$('host').value=event?.host||'';$('start').value=event?.start_time?.slice(0,5)||'';$('desc').value=event?.description||'';$('deleteBtn').classList.toggle('hidden',!event)}
$('eventPicker').addEventListener('change',fillEditor);$('newBtn').addEventListener('click',()=>{$('eventPicker').value='';fillEditor();$('title').focus()});
$('saveBtn').addEventListener('click',async()=>{
 const title=$('title').value.trim();if(!title){editStatus('Please enter an activity title.',true);return}
 const currentId=$('eventPicker').value,record={event_date:dateFor(selected),title,host:$('host').value.trim()||null,start_time:$('start').value||null,description:$('desc').value.trim()||null};
 $('saveBtn').disabled=true;editStatus('Saving…');
 try{await authorizedCall('/rest/v1/weekly_events'+(currentId?'?id=eq.'+encodeURIComponent(currentId):''),{method:currentId?'PATCH':'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(record)});await loadWeek();editStatus('Activity saved successfully.');}
 catch(err){editStatus('Could not save: '+err.message,true)}finally{$('saveBtn').disabled=false}
});
$('deleteBtn').addEventListener('click',async()=>{const id=$('eventPicker').value;if(!id||!confirm('Delete this activity from the weekly schedule?'))return;try{await authorizedCall('/rest/v1/weekly_events?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadWeek();editStatus('Activity deleted.')}catch(err){editStatus('Could not delete: '+err.message,true)}});
$('logoutBtn').addEventListener('click',()=>{session=null;editorAuthorized=false;sessionStorage.removeItem('hallSession');updateAuthUI();editStatus('Logged out.');$('editorToggle').textContent='Spiritual Team · Editor login'});
const fire=$('fire');for(let i=0;i<8;i++){const e=document.createElement('div');e.className='flame';e.style.cssText='--x:'+(22+i*7)+'%;--w:'+(9+Math.random()*10)+'%;--h:'+(50+Math.random()*35)+'%;--dur:'+(0.7+Math.random()*1.1)+'s';fire.appendChild(e)}for(let i=0;i<24;i++){const e=document.createElement('div');e.className='ember';e.style.cssText='--x:'+(20+Math.random()*60)+'%;--dx:'+((Math.random()-.5)*100)+'px;--dur:'+(2+Math.random()*3)+'s;--delay:-'+(Math.random()*5)+'s';$('embers').appendChild(e)}
$('motion').addEventListener('click',()=>{const r=$('wrap').classList.toggle('reduced');$('motion').textContent=r?'▶':'✧'});
(async()=>{weekMonday=startOfWeek(londonToday());await loadWeek();try{session=JSON.parse(sessionStorage.getItem('hallSession')||'null')}catch{}if(session){if(session.expires_at*1000<Date.now()+60000)await refreshSession();await checkEditor()}})();
</script></body></html>
